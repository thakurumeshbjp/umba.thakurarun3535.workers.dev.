name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run CI smoke test
        shell: bash
        run: |
          set -euo pipefail
          echo "Hello, world!"
          echo "CI workflow completed successfully."
